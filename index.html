<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix - Landing Page</title>
</head>
<body class="general-container">
    <main>
        <!--

        En esta sección de código habita el encabezado principal de la página
        contiene el logo de la plataforma, drop down list box que permite cambiar el idioma 
        y el botón para iniciar sessión, además, tenemos un titulo que nos da una introduccion a la landing page,
        un input para ingresar el correo electronico y ademas un botón pasar a la opción de registrarse

        -->

        <section class="hero-login-register">
            <header class="hero-cont-register">

                <nav class="hero-nav-principal">

                    <div class="hero-cont-logo">
                        <h1 class="netflix-logo">NETFLIX<h1>                  
                    </div>

                    <div class="hero-cont-buttons">

                        <div class="hero-language-container">
                            <select id="languageSelector">
                                <option value="es">Español</option>
                                <option value="en">English</option>
                            </select>
                        </div>

                        <button class="hero-sign-in">
                            <p class="sign-in">Iniciar Sesion</p>
                        </button>
                    </div>

                </nav>

                <section class="hero-form">
                    <section class="section-register">

                        <article class="casilla-1">
                            <h1 class="title-description" id="title-description">Películas y series ilimitadas y mucho más</h1>
                            <p class="txt-description" id="txt-description">A partir de $ 18.900. Cancela cuando quieras.</p>
                        </article>

                        <article class="casilla-2">

                            <h3 class="register-txt">¿Quieres ver Netflix ya? Ingresa tu email para crear una cuenta o reiniciar tu membresía de Netflix.</h3>    

                            <div class="mini-form">

                                <input type="email" name="email-register" id="user-email" placeholder="Email">

                                <button class="comenzar" type="submit">Comenzar<div aria-hidden="true" class="flechita"><svg viewBox="0 0 24 24" width="24" height="24" data-icon="ChevronRightMedium" data-icon-id=":r4:" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" role="img"><path fill="currentColor" fill-rule="evenodd" d="m15.586 12-7.293 7.293 1.414 1.414 8-8a1 1 0 0 0 0-1.414l-8-8-1.414 1.414z" clip-rule="evenodd"></path></svg></div></button>

                            </div>
                        </article>
                    </section>
                </section>

            </header>
        </section>

    </main>
</body>
</html>
